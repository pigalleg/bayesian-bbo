[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-bbo"
version = "0.1.0"
description = "A developing Bayesian black-box optimisation capstone"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "notebook==7.5.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
